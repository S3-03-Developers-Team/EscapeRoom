version: '3.8'

services:
  # 1. Servicio de la Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: mysql_db
    # **INSTRUCCIÓN CLAVE** para cargar variables desde el archivo .env
    env_file:
      - .env
    environment:
      # Credenciales cargadas desde el archivo .env
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      # Volumen para persistencia de datos (tipo 'named volume')
      - db_data:/var/lib/mysql
      # Volumen para scripts de inicialización (tipo 'bind mount')
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - app_network
    restart: always

  # 2. Servicio de la Aplicación Java
  app:
    image: eclipse-temurin:21-jre-alpine
    container_name: java_app
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - app_network
    environment:
      # La URL de la DB también usa las variables
      DB_URL: jdbc:mysql://db:3306/${DB_DATABASE}?autoReconnect=true&useSSL=false
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./target/S3.3-escape-room-1.0-SNAPSHOT.jar:/app/app.jar
    command: java -jar /app/app.jar



# Configuración de Redes y Volúmenes
networks:
  app_network:
    driver: bridge

volumes:
  db_data: